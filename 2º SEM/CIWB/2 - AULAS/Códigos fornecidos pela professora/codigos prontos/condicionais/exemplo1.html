<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exemplo1</title>
    </head>
    <body>
        <script>
            function principal() {
                let numero;
                numero = Number(prompt("Digite um número"));
                if (numero % 2 == 0) {
                    alert(`O número ${numero} é par.`);
                } 
                else {
                    alert(`O número ${numero} é ímpar.`);
                }  
            }

            principal();

        </script>





    </body>
</html>
