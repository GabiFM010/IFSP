<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exemplo2</title>
    </head>
    <body>
        <script>
            function principal() {
                let salario, aumento, novoSalario;
                salario = parseFloat(prompt('Digite o salário'));

                if (salario <= 1200) {
                    aumento = salario * 0.2;
                } else if (salario <= 1500) {
                    aumento = salario * 0.3;
                } else {
                    aumento = salario * 0.1;
                }
                novoSalario = salario + aumento;
                alert(   
                    "Valor do aumento = " + aumento.toFixed(2) +
                    "\nValor do novo salário = " + novoSalario.toFixed(2)
                );
            }

            principal();
        </script>
        





    </body>
</html>
