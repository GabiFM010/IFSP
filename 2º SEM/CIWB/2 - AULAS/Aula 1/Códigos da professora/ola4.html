<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Olá mundo em JavaScript</title>
</head>
<body>
  <p id="texto"></p>
  <button type="button" onclick="olaMundo()">Clique</button>
  <script>
    function olaMundo(){
      document.getElementById('texto').innerHTML = "Olá mundo!";
    }
  </script>
</body>
</html>
