<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <header>
        <h1>Exemplos de formulários (continuação...)</h1>
    </header>

    <main>

        <form action="#" method="post">

            <!-- tipo text -->
            <label for="nome">Nome</label><br>
            <input type="text" name="nome" id="name" required
            minlength="5" maxlength="10" 
            placeholder="Escreva seu nome aqui...">

            <br><br>

            <!-- tipo checkbox -->
            <input type="checkbox" name="termos" id="termos" checked>
            <label for="termos">Concordo com os termos.</label>

            <br><br>

            <!-- tipo color-->
            <label for="cor">Escolha a cor do tema</label>
            <input type="color" name="cor" id="cor" 
            value="#989898">

            <br><br>

            <!-- tipo date -->
            <label for="data">Data do evento</label> 
            <input type="date" name="data" id="data"
            min="2026-01-01" max="2026-12-31">

            <br><br>

            <!-- tipo file -->
            <label for="arquivo">Faça upload da sua foto</label> 
            <input type="file" name="arquivo" id="arquivo">

            <br><br>

            <!-- tipo hidden -->
            <input type="hidden" name="escondido" value="7">

            <!-- tipo password -->
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha"
             maxlength="8" minlength="5">

            <br><br>

            <!-- tipo radio -->
            <p>Pra qual time você torce?</p>
            
            <input type="radio" name="time" id="time1" value="corinthians">
            <label for="time1">Corinthians</label><br>

            <input type="radio" name="time" id="time2" value="são paulo">
            <label for="time2">São Paulo</label><br>

            <input type="radio" name="time" id="time3" value="palmeiras" checked>
            <label for="time3">Palmeiras</label><br>

            <input type="radio" name="time" id="time4" value="santos">
            <label for="time4">Santos</label><br>

            <br><br>

            <label for="idade">Idade</label><br>
            <input type="number" name="idade" id="idade"
            min="0" max="120" step="5">

            <br><br>

            <label for="altura">Altura</label>
            <input type="number" name="altura" id="altura"
            min="0" max="2.5" step="0.01">

            <br><br>

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email">

            <br><br>

            <label for="nota">Qual sua nota para o curso?</label>
            <input type="range" name="nota" id="nota"
            min="0" max="10" step="1" 
            oninput="saida.value = this.value;">
            <output name="saida"></output>

            <br><br>

            <button type="submit">Enviar</button>

        </form>

    </main>
</body>
</html>
