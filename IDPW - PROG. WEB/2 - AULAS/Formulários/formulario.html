<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>

    <header>
        <h1> Exemplos de formularios </h1>
    </header>

    <main>
        <!-- <form action="processa.php" method="get"> -->
        <form action="processa.php" method="post" autocomplete="off">

            <fieldset>

                <legend>dados pessoais</legend>
                <label for="nome"> Nome</label>
                <!--label: rotulo, viés semantico, label diz qual é o proposito daquilo-->
                <input name="nome" id="nome">
                <!--input: entrada, gera um retangulo e existem varios jeitos do navegador renderizar-->
                <!--for: acessibilidade-->

                <br><br>

                <label>Sobrenome</label>
                <input name="sobrenome">

                <label for="cidade">Cidade de nascimento</label>
                <input name="cidade" id="cidade" list="listacidade">
                <datalist id="listacidade">
                    <option value="Araraquara">
                    <option value="Américo Brasiliense">
                    <option value="Rincão">
                    <option value="São Carlos">
                </datalist>

            </fieldset> <!--criou uma caixa-->

            <br><br>

                <label for="carro"> Marcas de carro </label>
                    <select name="carro" id="carro">

                        <!-- gera uma listinha dentro de uma seta pra baixo (dropdown) -->
                        <option value="toyota">Toyota</option>
                        <option value="honda">Honda</option>
                        <option value="mercedes">Mercedes</option>
                        <option value="hyundai">Hyundai</option>
                        <option value="volkswagen">Volkswagen</option>

                    </select>

            <br><br>

                <label> Marcas de carro </label>

                    <select name="carro" size="3" multiple> <!-- multiple: Permite que o usuário selecione mais de uma opção ao mesmo tempo (geralmente segurando a tecla Ctrl no Windows ou Command no Mac) -->

                        <option value="toyota">Toyota</option>
                        <option value="honda">Honda</option>
                        <option value="mercedes">Mercedes</option>
                        <option value="hyundai">Hyundai</option>
                        <option value="volkswagen">Volkswagen</option>

                    </select>

            <br><br>

                <label> Marcas de carro </label>

                    <select name="carro" size="4" multiple>

                        <option value="toyota">Toyota</option>
                        <option value="honda" selected>Honda</option> <!--selected: por padrao essa linha aqui ja vai estar selecionada-->
                        <option value="mercedes">Mercedes</option>
                        <option value="hyundai">Hyundai</option>
                        <option value="volkswagen">Volkswagen</option>

                    </select>

            <br><br>

                <label> Marcas de carro </label>

                    <select name="carro" id="carro">

                        <option value="" disabled selected>Escolha uma marca</option>
                        <option value="toyota">Toyota</option>
                        <option value="honda">Honda</option>
                        <option value="mercedes">Mercedes</option>
                        <option value="hyundai">Hyundai</option>
                        <option value="volkswagen">Volkswagen</option>

                    </select>

            <br><br>

                <label for="msg">Mensagem</label>
                <textarea name="msg" id="msg" cols="50" rows="10"></textarea>

                <input type="submit" value="Enviar">
                <!--value: texto do botão-->

            <br><br>

                <button>Enviar</button>

            <br><br>
            
                <button type="submit">Enviar</button>

        </form>
    </main>
    
</body>
</html>
