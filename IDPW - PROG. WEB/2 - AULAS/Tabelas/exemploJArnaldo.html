<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
    <header>
        <h1>Tabelas</h1>
    </header>

    <!-- <table> é a tag base da tabela-->
    <table border="1">
        <!-- Adiciona uma legenda na tabela -->
        <caption>Ranking de linguagens de programação do TIOBE.</caption>

        <!-- <thead> é o cabeçalho da tabela -->
        <thead>
            <!-- <tr> cria um nova linha na tabela-->
            <tr>
                <!-- <th> cria uma célula para título de linha/coluna-->
                <th>Posição</th>
                <th>Linguagem de Programação</th>
                <th>Classificações</th>
            </tr>
        </thead>

        <!-- <tbody> contém as linhas de dados da tabela-->
        <tbody>
            <tr>
                <!-- <td> cria uma nova célula (coluna) na linha-->
                <td>1</td>
                <td>Python</td>
                <td>20,97%</td>
            </tr>

            <tr>
                <td>2</td>
                <td rowspan="2">C/C++</td>
                <td rowspan="2">20,37%</td>
            </tr>

            <tr>
                <td>3</td>
                <!-- <td>C++</td> -->
                <!-- <td>8,03%</td> -->
            </tr>

            <tr>
                <td>4</td>
                <td>Java</td>
                <td>7,79%</td>
            </tr>
        </tbody>

        <!-- <tfoot> contém o rodapé da tabela -->
        <tfoot>
            <tr>
                <td colspan="2">Total das classificações</td>
                <!-- <td></td> -->
                <td>48,95%</td>
            </tr>
        </tfoot>

    </table>

    <br>
    <br>
    <br>


    <table border="1">

        <thead>
            <tr>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
            </tr>
            <tr>
                <td>9</td>
                <td>10</td>
                <td colspan="2" rowspan="3">11</td>
                <!-- <td>12</td> -->

            </tr>
            <tr>
                <td>13</td>
                <td>14</td>
                <!-- <td>15</td> -->
                <!-- <td>16</td> -->

            </tr>
            <tr>
                <td>17</td>
                <td>18</td>
                <!-- <td>19</td> -->
                <!-- <td>20</td> -->
            </tr>
        </tbody>

    </table>

</body>
</html>
