<!-- Crie uma página pesquisa.html simulando uma pesquisa de satisfação de uma loja
virtual. O formulário deve conter:
    ● Campo de nome e e-mail (ambos opcionais) -
    ● Uma escala de avaliação de 1 a 5 usando botões de rádio agrupados e organizados em linha -
    ● Um <select> com a pergunta "Como nos conheceu?", com opções como redes sociais, indicação, busca no Google etc. -
    ● Um campo de upload para o cliente anexar um comprovante ou print -
    ● Uma área de comentários livres -
    ● Botão de enviar avaliação - 

    Gabrielly Fernanda - TSI - J. Arnaldo

-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exercicio 4 </title>
</head>
<body>

    <header>
        <h1> Exercicio 4 de Formularios - IDPW </h1>
    </header>

    <main>
        <form action="" method="post">
            <fieldset>
                <legend>Dados do usuario</legend>

                <!--nome do usuario p/ cadastro opcional-->
                <label for="nome">Nome</label>
                <input name="nome" id="nome">

                <br>    

                <!--campo de email opcional-->
                <label for="email">Digite seu E-mail</label>
                <input type="email" name="email" id="email">

                <br>

                <p>Satisfação (1-5)</p> <!--Para permitir apenas uma seleção em um grupo de radio, todos os inputs precisam ter o mesmo atributo name-->
            
                <input type="radio" name="avaliacao" id="ruim" value="ruim">
                <label for="ruim">1 - Ruim</label><br>

                <input type="radio" name="avaliacao" id="regular" value="regular">
                <label for="regular">2 - Regular</label><br>

                <input type="radio" name="avaliacao" id="boa" value="boa">
                <label for="boa">3 - Boa</label><br>

                <input type="radio" name="avaliacao" id="muitoboa" value="muitoboa">
                <label for="muitoboa">4 - Muito boa</label><br>

                <input type="radio" name="avaliacao" id="excelente" value="excelente">
                <label for="excelente">5 - Excelente</label><br>

                <br>

                <label for="conheceu">Como nos conheceu?</label>
                    <label for="conhecer"></label>
                        <select name="genero" id="genero" required>
                            <option value="" disabled selected>Selecione aqui</option>
                            <option value="toyota">Instagram</option>
                            <option value="hyundai">Facebook</option>
                            <option value="honda">LinkedIn</option>
                            <option value="volkswagen">Indicação</option>
                            <option value="volkswagen">Navegadores de busca</option>
                        </select>

                <br><br>

                <form action="upload.php" method="post" enctype="multipart/form-data">
                    <label for="file">Selecione o arquivo aqui</label>
                    <input type="file" name="arquivo" id="arquivo">
                </form>

                <br><br>
                
                <label for="mensagem">Deixe um comentario para nós aqui!</label> <br>
                <textarea id="mensagem" name="mensagem" rows="6" cols="50" required></textarea>

            </fieldset>

            <br>

            <input type="submit" value="Enviar avaliação">
        </form>
    </main>
    
</body>
</html>
