<!--Crie uma página cadastro.html com um formulário de cadastro de usuário contendo:
    ● Campos de nome completo, e-mail e senha
    ● Um campo de data de nascimento
    ● Um seletor de gênero com ao menos 3 opções
    ● Um botão de cadastrar

    Todos os campos devem ser obrigatórios e possuir rótulos visíveis associados a
cada campo.

    Gabrielly Fernanda - TSI - J. Arnarldo
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
</head>
<body>

    <header>
        <h1>Exercicio 2 de Formulários - IDPW</h1>
    </header>

    <main>

        <form action="" method="post">
            <fieldset>   
                <legend>Dados para cadastro</legend>

                <!--nome do usuario p/ cadastro-->
                <label for="nome">Nome completo</label>
                <input name="nome" id="nome" required>   

                <label for="nascimento">Data de nascimento</label> 
                <input type="date" name="nascimento" id="nascimento" min="1900-01-01" max="2008-01-01" required>

                <br>

                <!--campo de email-->
                <label for="email">Digite seu E-mail</label>
                <input type="email" name="email" id="email" required>

                <!-- campo de senha-->
                <label for="senha">Crie sua senha</label>
                <input type="password" name="senha" id="senha" required/>
                <!--<input type="checkbox" />-->

                <br>

                <label for="genero">Seu gênero</label>
                    <select name="genero" id="genero" required>
                        <option value="" disabled selected>Selecione seu gênero</option>
                        <option value="toyota">Mulher cis</option>
                        <option value="hyundai">Homem cis</option>
                        <option value="honda">Mulher trans</option>
                        <option value="volkswagen">Homem trans</option>
                        <option value="volkswagen">Prefiro não informar</option>
                    </select>      

            </fieldset>

            <br>

            <input type="submit" value="Concluir cadastro">

        </form>


    </main>
    
</body>
</html>
